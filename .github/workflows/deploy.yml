name: Deploy Ruta Clara to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build production files
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pnpm install && pnpm run build

      - name: Prepare root Pages artifact
        run: |
          touch dist/public/.nojekyll
          printf '%s\n' 'ruta-clara.casi40tech.lat' > dist/public/CNAME
          VERSION="$(date -u +%Y%m%d%H%M%S)"
          sed -i -E "s#(assets/index-[^\"']+\.(js|css))#\1?v=${VERSION}#g" dist/public/index.html
          printf '%s\n' "Cache-busting version: ${VERSION}"

      - name: Publish dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist/public
          force_orphan: true
          cname: ruta-clara.casi40tech.lat
